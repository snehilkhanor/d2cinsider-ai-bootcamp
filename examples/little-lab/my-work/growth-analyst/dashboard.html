<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly dashboard</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2118;--muted:#7a6a5a;--line:#e6dccd;--accent:#a8541a;--alarm:#9b2c1f;--alarm-bg:#fbe9e4;--up:#2f6b3a;--down:#9b2c1f}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#1c1712;--card:#27201a;--ink:#f1e8da;--muted:#a8998a;--line:#3a3027;--accent:#e0934f;--alarm:#f08a78;--alarm-bg:#3a1f1a;--up:#7cc48a;--down:#f08a78}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:28px;margin:0}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:36px 0 12px}
.sub{color:var(--muted);margin:4px 0 16px}.headline{font-size:19px;max-width:760px}
.note{border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:14px;margin-top:16px}
.alarm{background:var(--alarm-bg);border-left:6px solid var(--alarm);border-radius:8px;padding:20px 22px;margin-top:24px}
.alarm h3{margin:0 0 6px;color:var(--alarm);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.alarm .big{font-size:26px;font-weight:700}.alarm p{margin:10px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:22px;font-weight:700;margin-top:2px}.kpi .d{font-size:13px;margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.nc{color:var(--muted);font-style:italic}
ul{padding-left:18px;margin:0}li{margin:8px 0}code{font-size:13px;color:var(--accent)}
svg text{fill:var(--muted);font-size:12px}
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="data">{"as_of": "2026-05-12T08:42:00+05:30", "brand": "Little Lab", "stage": "1-50Cr", "founder_truth": {"cac": 440, "ltv": 2150, "aov": 785, "gross_margin": 0.62, "channel_mix": {"d2c": 0.55, "amazon": 0.3, "flipkart": 0.08, "quick_commerce": 0.07}, "repeat_purchase_rate": 0.26, "source": "brand-brain/unit-economics.md", "as_of": "2026-04-28"}, "live": {"revenue_7d": 1482000, "orders_7d": 1840, "new_customers_7d": 612, "repeat_customers_7d": 1228, "aov": 805, "cac_live": 495, "roas_blended": 2.1, "repeat_purchase_rate": 0.28, "total_ad_spend_7d": 302500, "per_channel": [{"channel": "D2C site", "revenue": 815000, "orders": 1012, "spend": null, "roas": null}, {"channel": "Amazon", "revenue": 444600, "orders": 552, "spend": 14800, "roas": 30.0}, {"channel": "Flipkart", "revenue": 118560, "orders": 147, "spend": 6200, "roas": 19.0}, {"channel": "Quick commerce", "revenue": 103840, "orders": 129, "spend": null, "roas": null}, {"channel": "Meta ads", "revenue": 402000, "orders": 498, "spend": 215000, "roas": 1.9}, {"channel": "Google ads", "revenue": 98500, "orders": 122, "spend": 38500, "roas": 2.6}], "trend_4w": [{"week_start": "2026-04-21", "revenue": 1355000, "orders": 1700, "cac": 440, "roas": 2.4}, {"week_start": "2026-04-28", "revenue": 1383000, "orders": 1740, "cac": 469, "roas": 2.5}, {"week_start": "2026-05-05", "revenue": 1440000, "orders": 1820, "cac": 420, "roas": 2.6}, {"week_start": "2026-05-12", "revenue": 1482000, "orders": 1840, "cac": 495, "roas": 2.1}]}, "alarm": {"metric": "blended_cac", "this_week": 495, "prior_week": 420, "delta_pct": 17.86, "driver": "Meta CAC moved from ₹485 to ₹612. The Hero SKU lifestyle angle that launched May 5 spent ₹84,000 of the week's ₹2,15,000 Meta budget at 1.4x ROAS. The two older angles (problem-solver, social-proof) held at 2.6x.", "recommended_action": "Pause the Hero SKU lifestyle angle by EOD Monday. Reallocate ₹12,000/day to the problem-solver angle (Cradle Cap Balm creative). Retest the lifestyle angle only after the new creative brief from Session 05 ships. Owner: Performance Marketer with founder approval."}, "gaps": [{"metric": "blended_cac_vs_target", "founder_value": 440, "live_value": 495, "delta_pct": 12.5, "above_20pct_threshold": false}, {"metric": "roas_blended_vs_4w_avg", "founder_value": 2.4, "live_value": 2.1, "delta_pct": -12.5, "above_20pct_threshold": false}], "missing": ["live_store_connection", "live_meta_ads_connection", "live_google_ads_connection"], "running_on_sample_data": false, "sample_data_reasons": ["Live Shopify export not connected for this brand. Filled in from examples/little-lab/sample-inputs/shopify-orders-28d.csv.", "Live Meta Ads connection not set up. Filled in from examples/little-lab/sample-inputs/meta-ads-spend.csv.", "Live Google Ads connection not set up. Filled in from examples/little-lab/sample-inputs/google-ads-spend.csv."], "sample_data_fixes": ["Connect Shopify, see after-the-bootcamp/connectors.md.", "Connect Meta Ads the same way.", "Connect Google Ads the same way.", "Keep brand-brain/unit-economics.md fresh. It is the source of CAC, LTV, AOV, gross margin and channel mix."], "cross_teammate_inputs": [{"teammate": "voice-of-customer", "file_path": "my-work/voice-of-customer/2026-05-12-voc-report.md", "key_insight": "Cradle cap theme rose to 21% of tickets, up from 18% the prior month. Problem-solver demand is rising."}, {"teammate": "market-analyst", "file_path": "my-work/market-analyst/2026-05-12-intel-report.md", "key_insight": "Tender Root launched a Newborn Calendula Lotion at ₹529. It will pressure Tier-2 acquisition this week."}, {"teammate": "content-lead", "file_path": "my-work/content-lead/2026-05-12-index.md", "key_insight": "30-day content calendar shipped. May 13 cradle cap carousel goes live Monday."}, {"teammate": "performance-marketer", "file_path": "my-work/performance-marketer/2026-05-13-index.md", "key_insight": "Two replacement ad angles drafted (problem-solver, social-proof). Ready to swap in for the lifestyle angle that bled CAC."}, {"teammate": "storefront-specialist", "file_path": "my-work/storefront-specialist/2026-05-13-index.md", "key_insight": "Bath and Hair Wash PDP rewrite drafted in response to 3 lather-related returns this week. Push live Wednesday, measure for 14 days."}], "headline": "A steady-revenue week with the metric to watch on the buy side. Blended CAC moved up 18% week on week, almost entirely on Meta.", "data_source_note": "Built from the sample exports in examples/little-lab/sample-inputs/, not a live connection."}</script>
<script>
(function(){
var d=JSON.parse(document.getElementById('data').textContent),L=d.live||{},app=document.getElementById('app');
function inr(n){if(n===null||n===undefined)return null;n=Math.round(n);var s=String(Math.abs(n));if(s.length>3){var h=s.slice(0,-3),t=s.slice(-3),p=[];while(h.length>2){p.unshift(h.slice(-2));h=h.slice(0,-2)}if(h)p.unshift(h);s=p.join(',')+','+t}return(n<0?'-':'')+'\u20B9'+s}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function label(m){return String(m).replace(/_/g,' ')}
var h='';
h+='<h1>'+esc(d.brand||'Brand')+'</h1><div class="sub">Weekly dashboard, '+esc((d.as_of||'').slice(0,10))+'</div>';
if(d.headline)h+='<p class="headline">'+esc(d.headline)+'</p>';
if(d.running_on_sample_data)h+='<div class="note">This brief is running on sample data, not your own numbers.</div>';
if(d.data_source_note)h+='<div class="note">'+esc(d.data_source_note)+'</div>';
var a=d.alarm;
if(a){var pct=a.metric.indexOf('pct')>-1,money=a.metric.indexOf('cac')>-1;function fv(v){return pct?v+'%':(money?inr(v):v)}
h+='<div class="alarm"><h3>The one alarm: '+esc(label(a.metric))+'</h3><div class="big">'+fv(a.prior_week)+' \u2192 '+fv(a.this_week)+' <span style="font-size:16px">('+(a.delta_pct>0?'+':'')+a.delta_pct+'%)</span></div><p>'+esc(a.driver)+'</p><p><strong>This week:</strong> '+esc(a.recommended_action)+'</p></div>'}
else h+='<div class="note">A steady week. No alarm fired.</div>';
var T=L.trend_4w||[],prev=T.length>1?T[T.length-2]:null;
function kpi(l,v,pv,fmt,goodUp){if(v===null||v===undefined)return'';var dl='';if(pv){var c=(v-pv)/pv*100,good=(c>=0)===goodUp;dl='<div class="d '+(good?'up':'down')+'">'+(c>=0?'\u25B2 ':'\u25BC ')+Math.abs(c).toFixed(1)+'% vs '+fmt(pv)+'</div>'}return'<div class="kpi"><div class="l">'+l+'</div><div class="v">'+fmt(v)+'</div>'+dl+'</div>'}
function num(x){return Number(x).toLocaleString('en-IN')}
h+='<h2>This week</h2><div class="kpis">'+kpi('Revenue',L.revenue_7d,prev&&prev.revenue,inr,true)+kpi('Orders',L.orders_7d,prev&&prev.orders,num,true)+kpi('Cost per new customer',L.cac_live,prev&&prev.cac,inr,false)+kpi('Revenue per \u20B91 of ads',L.roas_blended,prev&&prev.roas,function(x){return x},true)+kpi('New customers',L.new_customers_7d,null,num,true)+kpi('Average order',L.aov,null,inr,true)+'</div>';
if(T.length>1){var key=(a&&a.metric==='blended_cac')?'cac':'revenue',vals=T.map(function(t){return t[key]}),mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),W=900,H=220,pad=50,pts=vals.map(function(v,i){return[pad+i*(W-2*pad)/(vals.length-1),H-40-((v-mn)/((mx-mn)||1))*(H-90)]});
var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Four week trend"><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="'+pts.map(function(p){return p.join(',')}).join(' ')+'"/>';
pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--accent)"/><text x="'+p[0]+'" y="'+(p[1]-12)+'" text-anchor="middle">'+inr(vals[i])+'</text><text x="'+p[0]+'" y="'+(H-12)+'" text-anchor="middle">'+esc(T[i].week_start.slice(5))+'</text>'});
h+='<h2>Four week trend: '+(key==='cac'?'cost per new customer':'revenue')+'</h2><div class="card">'+s+'</svg></div>'}
var pc=L.per_channel||[];
if(pc.length){h+='<h2>By channel</h2><div class="card"><table><tr><th>Channel</th><th class="n">Revenue</th><th class="n">Orders</th><th class="n">Ad spend</th><th class="n">Return</th></tr>';
pc.forEach(function(c){function cell(v,f){return v===null||v===undefined?'<td class="n nc">not available</td>':'<td class="n">'+f(v)+'</td>'}h+='<tr><td>'+esc(c.channel)+'</td>'+cell(c.revenue,inr)+cell(c.orders,num)+cell(c.spend,inr)+cell(c.roas,function(x){return x+'x'})+'</tr>'});h+='</table></div>'}
var x=d.cross_teammate_inputs||[];
if(x.length){h+='<h2>What the other teammates added</h2><div class="card"><ul>';x.forEach(function(i){h+='<li>'+esc(i.key_insight)+'<br><code>'+esc(i.file_path)+'</code></li>'});h+='</ul></div>'}
var g=(d.gaps||[]).filter(function(q){return q.above_20pct_threshold});
if(g.length){h+='<h2>Where your number and the data disagree by more than 20%</h2><div class="card"><ul>';g.forEach(function(q){h+='<li>'+esc(label(q.metric))+': you say '+q.founder_value+', the data says '+q.live_value+' ('+(q.delta_pct>0?'+':'')+q.delta_pct+'%)</li>'});h+='</ul></div>'}
var m=d.missing||[];
if(m.length){h+='<h2>Not available this week</h2><div class="card"><ul>';m.forEach(function(q){h+='<li>'+esc(label(q))+'</li>'});h+='</ul></div>'}
app.innerHTML=h;
})();
</script>
</body>
</html>
